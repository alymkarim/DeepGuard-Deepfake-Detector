workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-4
    replicaCount: 1
    diskSpec:
      bootDiskType: pd-ssd
      bootDiskSizeGb: 100
    containerSpec:
      imageUri: europe-west2-docker.pkg.dev/project-7bab4e3a-59d6-4a1f-a7f/deepguard-training/deepguard-trainer:v1
      env:
        - name: GCS_BUCKET
          value: alya-deepguard-data-2026
        - name: DATASET_ZIP_BLOB
          value: datasets/deepfake-frames.zip
        - name: OUTPUT_PREFIX
          value: outputs/deepguard-v1